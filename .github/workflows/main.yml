name: Publicar Agrícola Don Ricardo en Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEPLOY_TARGET: github-pages
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: ${{ vars.NEXT_PUBLIC_ENABLE_GOOGLE_AUTH || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validar proyecto Supabase de IA
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo '::error::Configura NEXT_PUBLIC_SUPABASE_URL del proyecto independiente de IA en Actions Variables'; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo '::error::Configura NEXT_PUBLIC_SUPABASE_ANON_KEY en Actions Variables'; exit 1; }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verificar exportación y rutas
        run: |
          test -f out/login/index.html
          test -f out/actualizar-password/index.html
          test -f out/auth/callback/index.html
          test -f out/campo/index.html
          test -f out/packing/index.html
          test -f out/gerente/index.html
          grep -q '/PROYECTO_CURSO_IA/_next/' out/login/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: out
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
